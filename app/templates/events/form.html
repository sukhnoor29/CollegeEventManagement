{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">EVENT MANAGEMENT</p><h1>{{ page_title }}</h1><p class="muted">Add the event information students need before they register.</p></div><a class="button button-ghost" href="{{ url_for('events.event_list') }}">Back to events</a></div>
<section class="form-card wide-form"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label class="full-width">Event name<input name="event_name" maxlength="160" value="{{ event.event_name if event else '' }}" required></label>
    <label>Category<input name="category" maxlength="80" placeholder="Technology, Cultural, Sports..." value="{{ event.category if event else '' }}" required></label>
    <label>Venue<input name="venue" maxlength="180" value="{{ event.venue if event else '' }}" required></label>
    <label>Event date and time<input type="datetime-local" name="starts_at" value="{{ event.starts_at.strftime('%Y-%m-%dT%H:%M') if event else '' }}" required></label>
    <label>Registration deadline <span class="muted">(optional)</span><input type="datetime-local" name="registration_deadline" value="{{ event.registration_deadline.strftime('%Y-%m-%dT%H:%M') if event and event.registration_deadline else '' }}"></label>
    <label>Registration limit<input type="number" name="registration_limit" min="1" value="{{ event.registration_limit if event else 100 }}" required></label>
    <label class="full-width">Description<textarea name="description" rows="5" required>{{ event.description if event else '' }}</textarea></label>
  </div>
  <label class="checkbox-label"><input type="checkbox" name="is_published" {% if event is none or event.is_published %}checked{% endif %}> Publish event and make it visible to students</label>
  <div class="form-actions"><button class="button" type="submit">Save event</button><a class="button button-ghost" href="{{ url_for('events.event_list') }}">Cancel</a></div>
</form></section>
{% endblock %}
